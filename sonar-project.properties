# Analyse de la qualité du code par SonarQube Cloud (lancée par la CI GitHub Actions)
sonar.projectKey=M-elmoussaoui0_le-grand-cinema-back
sonar.organization=m-elmoussaoui0
sonar.projectName=Le Grand Cinéma – API

# Code de l'application et code des tests
sonar.sources=src
sonar.exclusions=**/*.spec.ts
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,test/**/*.ts

# Couverture : tests unitaires (Jest) + tests d'intégration (API + PostgreSQL)
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-e2e/lcov.info
sonar.coverage.exclusions=src/main.ts

sonar.sourceEncoding=UTF-8
